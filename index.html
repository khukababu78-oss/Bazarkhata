<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: phone-first notebook. Dark-green top band, turmeric used only for the one highlight stat and today's bar, fixed bottom tabs. */
:root{
  --bg:#EDF1ED; --card:#FFFFFF; --field:#F6F8F6; --ink:#13201B; --mute:#5A6A63; --line:#D6DDD7; --soft:#E4EAE5;
  --head:#0E3B31; --on-head:#F2F7F4;
  --brand:#0F5B4B; --on-brand:#FFFFFF;
  --hl:#E6A700; --on-hl:#2B1F00; --hl-soft:#FFF1C9; --hl-ink:#7A5600;
  --bad:#B3261E; --bad-soft:#FBE3E0; --ok:#1B7A4A; --ok-soft:#DDF1E5;
  --display:'Anek Bangla','Noto Sans Bengali',system-ui,sans-serif;
  --body:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1411; --card:#151F1B; --field:#101914; --ink:#E7EFEA; --mute:#9AAAA2; --line:#273530; --soft:#1C2924;
  --head:#122620; --on-head:#E7EFEA; --brand:#3FBF9F; --on-brand:#04251C;
  --hl:#F2B632; --on-hl:#2B1F00; --hl-soft:#33280A; --hl-ink:#F2B632;
  --bad:#FF8A80; --bad-soft:#3A1A18; --ok:#6FD6A0; --ok-soft:#14301F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1411; --card:#151F1B; --field:#101914; --ink:#E7EFEA; --mute:#9AAAA2; --line:#273530; --soft:#1C2924;
  --head:#122620; --on-head:#E7EFEA; --brand:#3FBF9F; --on-brand:#04251C;
  --hl:#F2B632; --on-hl:#2B1F00; --hl-soft:#33280A; --hl-ink:#F2B632;
  --bad:#FF8A80; --bad-soft:#3A1A18; --ok:#6FD6A0; --ok-soft:#14301F; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--head);z-index:30}
.wrap{width:100%;max-width:720px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2{font-family:var(--display);font-weight:700;margin:0;line-height:1.3;text-wrap:balance}
h1{font-size:24px} h2{font-size:18px}
p{margin:0}
.mute{color:var(--mute)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);color:var(--on-head)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;padding-bottom:12px}
.tt{display:flex;flex-direction:column;min-width:0}
.rn{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.25;overflow-wrap:anywhere}
.who{font-size:13px;opacity:.8}
.ghost{background:transparent;color:var(--on-head);border:1px solid color-mix(in srgb,var(--on-head) 40%,transparent);border-radius:10px;min-height:40px;padding:0 14px;font:500 14px var(--body);cursor:pointer;flex:none}
.banner{background:var(--hl-soft);color:var(--hl-ink);font-size:14px}
.banner p{padding-top:8px;padding-bottom:8px}

main.wrap{padding-top:14px;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.sum{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;color:var(--brand)}

form{display:flex;flex-direction:column;gap:14px;margin-top:12px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0;border:0;padding:0;margin:0}
label,legend{font-size:14px;font-weight:600;color:var(--mute);padding:0}
input,select{width:100%;min-width:0;max-width:100%;min-height:46px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);font:400 16px var(--body)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.qty{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:8px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg label{position:relative;margin:0;color:var(--ink)}
.seg input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.seg span{display:flex;align-items:center;justify-content:center;min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--field);font-weight:500;cursor:pointer}
.seg input:checked+span{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.seg input:focus-visible+span{outline:2px solid var(--hl);outline-offset:2px}
.btn{min-height:50px;border:0;border-radius:12px;background:var(--brand);color:var(--on-brand);font:600 17px var(--display);cursor:pointer;width:100%}
.btn:disabled{opacity:.55;cursor:default}
.err{color:var(--bad);font-size:14px}
.filt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.filt .wide{grid-column:1/-1}

.rows{list-style:none;margin:8px 0 0;padding:0}
.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.r-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.r-item{font-weight:600;overflow-wrap:anywhere}
.r-sub{font-size:14px;color:var(--mute);overflow-wrap:anywhere}
.r-end{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.amt{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.r-act{display:flex;gap:6px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:1px 9px;border-radius:999px;background:var(--soft);color:var(--mute)}
.chip.due{background:var(--bad-soft);color:var(--bad)}
.chip.paid{background:var(--ok-soft);color:var(--ok)}
.chip.mobile{background:var(--hl-soft);color:var(--hl-ink)}
.mini{min-height:34px;min-width:34px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font:500 13px var(--body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.mini svg{width:16px;height:16px}
.mini.armed{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grp{display:flex;justify-content:space-between;gap:12px;font-family:var(--display);font-weight:700;margin-top:14px;padding-bottom:2px}
.grp:first-child{margin-top:4px}
.grp span:last-child{font-variant-numeric:tabular-nums;color:var(--brand)}
.empty{color:var(--mute);padding:14px 0 4px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat small{font-size:13px;color:var(--mute)}
.stat b{font:700 22px/1.3 var(--display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat.hl{background:var(--hl);border-color:var(--hl);color:var(--on-hl)}
.stat.hl small{color:var(--on-hl);opacity:.8}
.cols{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;height:150px;margin-top:12px}
.col{display:grid;grid-template-rows:16px 1fr 18px;min-width:0;text-align:center}
.bv{font-size:11px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.tr{display:flex;align-items:flex-end;border-bottom:1px solid var(--line)}
.bar{width:100%;background:var(--brand);border-radius:4px 4px 0 0;min-height:2px}
.bar.today{background:var(--hl)}
.bl{font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
.top-item{display:flex;flex-direction:column;gap:4px;padding:8px 0}
.top-item .l{display:flex;justify-content:space-between;gap:12px}
.top-item i{display:block;height:6px;border-radius:3px;background:var(--brand)}
.split{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:12px 0 10px;background:var(--soft)}
.split i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend em{width:10px;height:10px;border-radius:3px;display:inline-block}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(62px,1fr);overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{background:transparent;border:0;color:var(--mute);min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:500 13px var(--body);cursor:pointer}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--brand);box-shadow:inset 0 3px 0 var(--hl);font-weight:600}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));max-width:min(92vw,520px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
#toast.bad{background:var(--bad);color:#fff}
.auth{padding-top:20px;padding-bottom:40px}
.auth .card{display:flex;flex-direction:column;gap:6px}
.urow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
.urow:first-child{border-top:0}
.urow .uinfo{display:flex;flex-direction:column;min-width:0}
.pinform{display:flex;gap:8px;width:100%;margin-top:0}
.pinform input{flex:1}
.pinform button{min-height:46px}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.presets .mini{min-height:38px;padding:0 14px;font-size:14px}
.tw{overflow-x:auto;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-size:13px;font-weight:600;color:var(--mute);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tfoot td{font-weight:700;border-top:2px solid var(--line);color:var(--brand)}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.btn.alt{background:transparent;color:var(--brand);border:1px solid var(--brand);font-size:15px}
.tab{position:relative}
.bdg{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--hl);color:var(--on-hl);font:600 11px/18px var(--body);text-align:center}
.acts .mini{align-self:flex-start}
.hint{font-size:13px;color:var(--mute)}
.seg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg3 button{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:500 15px var(--body);cursor:pointer}
.seg3 button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.spbody{display:flex;flex-direction:column;gap:12px}
.pform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%}
.pform .pf_shop,.pform .mini{grid-column:1/-1}
.pform .mini{min-height:44px}
.payf{display:flex;gap:8px;width:100%}
.bkf{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;margin-top:8px}
.bkf .bk_amt,.bkf .bk_note,.bkf .mini{grid-column:1/-1}
.bkf input,.bkf select{min-height:44px}
.bkf .mini{min-height:44px}
.bkh{margin-top:6px}
.pyform{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;margin-top:10px}
.pyform .pf_note,.pyform .mini,.pyform .pf_kind{grid-column:1/-1}
.pyform input,.pyform select,.pyform .mini{min-height:44px}
.pycalc{display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;margin-top:8px;font-size:14px}
.pycalc span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.pycalc .tot{font:700 16px var(--display);padding-top:4px;border-top:1px solid var(--line)}
.pyhist{width:100%;margin-top:8px;font-size:13px;color:var(--mute)}
.pyhist div{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dashed var(--line)}
.pyhist .void{text-decoration:line-through;opacity:.6}
.vform{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;margin-top:8px}
.vform .vf_note,.vform .mini{grid-column:1/-1}
.vform input,.vform select,.vform .mini{min-height:44px}
.xform{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;margin-top:8px}
.xform .xf_title,.xform .mini{grid-column:1/-1}
.xform input,.xform select,.xform .mini{min-height:44px}
.amt.bad{color:var(--bad)}
.payf input{flex:1;min-width:0;min-height:44px}
.payf .mini{min-height:44px}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
/* professional pass: hierarchy, focus, nav */
.card{box-shadow:0 1px 2px rgba(16,32,27,.06),0 4px 14px rgba(16,32,27,.04)}
.card h2{font-size:17px;letter-spacing:-.01em}
label,legend{color:var(--ink);opacity:.8;font-size:14px;font-weight:600}
input,select{border-color:color-mix(in srgb,var(--line) 80%,var(--ink) 20%)}
input:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent);outline:none}
.top-in{padding-top:14px;padding-bottom:14px}
.rn{font-size:19px;letter-spacing:-.01em}
.who{font-size:12.5px;opacity:.75;letter-spacing:.01em}
.btn{box-shadow:0 2px 8px color-mix(in srgb,var(--brand) 30%,transparent);letter-spacing:.005em}
.tabs{box-shadow:0 -4px 16px rgba(16,32,27,.06)}
.tab{font-size:12px;letter-spacing:.01em;min-height:64px}
.tab svg{width:21px;height:21px}
.tab[aria-current="page"] span{font-weight:700}
.bdg{top:6px;left:calc(50% + 9px);box-shadow:0 0 0 2px var(--card)}
.row{padding:14px 0}
.r-item{font-size:15.5px}
.amt{font-size:16px}
.sum{font-size:15px}
.empty{font-size:15px}
main.wrap{gap:14px}
.pstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.eform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%}
.eform .ef_item,.eform .ef_shop,.eform .mini{grid-column:1/-1}
.eform .mini{min-height:44px}
</style></head><body>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var BN_M=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
var BN_D=['রবি','সোম','মঙ্গল','বুধ','বৃহস্পতি','শুক্র','শনি'];
var UNITS=['কেজি','গ্রাম','লিটার','পিস','ডজন','হালি','বস্তা','কার্টন'];
var PAYS={cash:'নগদ',due:'বাকি',mobile:'মোবাইল'};
function pad(n){return String(n).padStart(2,'0')}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addDays(iso,n){var p=iso.split('-').map(Number);var d=new Date(p[0],p[1]-1,p[2]+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}

function money(n){return '৳ '+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2})}
function qtyFmt(n){return String(+Number(n||0).toFixed(2))}
function sum(a,f){return a.reduce(function(s,x){return s+(+f(x)||0)},0)}
function uniq(a){var seen={},out=[];a.forEach(function(x){var k=String(x||'').trim();if(k&&!seen[k.toLowerCase()]){seen[k.toLowerCase()]=1;out.push(k)}});return out}
var LS={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}},del:function(k){try{localStorage.removeItem(k)}catch(e){}}};

var S={me:null,users:{},entries:[],payments:[],expenses:[],sales:[],staff:[],pay:[],lists:[],products:[],shops:[],sp:'products',sel:null,draft:null,settings:null,got:{u:false,e:false,s:false,l:false,p:false,h:false,m:false,x:false,v:false},db:null,ready:false,tab:null,view:null,autoTried:false,r:null,dl:null,f:{from:'',to:'',q:'',pay:'',by:''}};
var app=$('#app'),cur=null,toastT=null;

function toast(msg,bad){var t=$('#toast');t.textContent=msg;t.className='show'+(bad?' bad':'');clearTimeout(toastT);toastT=setTimeout(function(){t.className=''},3200)}
function errMsg(e){var c=e&&e.code;if(c==='permission-denied')return 'সেভ হয়নি। এই কাজের অনুমতি নেই।';if(c==='unavailable'||c==='auth/network-request-failed')return 'ইন্টারনেট নেই। সংযোগ দেখে আবার চেষ্টা করুন।';return 'সেভ হয়নি। আবার চেষ্টা করুন।'}

async function hash(id,pin,salt){
  var s=salt+':'+id+':'+pin;
  try{var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}

}
function rnd(){return Math.random().toString(36).slice(2,10)}
function normId(s){return String(s||'').trim().toLowerCase()}
var ID_RE=/^[a-z0-9_-]{3,20}$/, PIN_RE=/^\d{4,6}$/;

/* ---------- Firebase: data, sign-in and access ---------- */
var CFG=window.FIREBASE_CONFIG||{};
var CFG_OK=!!(CFG.apiKey&&CFG.projectId&&String(CFG.apiKey).indexOf('PASTE')<0&&String(CFG.projectId).indexOf('PASTE')<0);
var unsubs=[],sec=null;
function toEmail(id){return id+'@bazarkhata.app'}
function toPass(pin){return pin+'-bk'}
async function put(coll,id,data){await S.db.doc(coll+'/'+id).set(data)}
async function patch(coll,id,data){await S.db.doc(coll+'/'+id).update(data)}
async function multi(ops){
  if(typeof S.db.batch==='function'){
    var bt=S.db.batch();
    ops.forEach(function(o){var r=S.db.doc(o.c+'/'+o.id);if(o.u)bt.update(r,o.d);else bt.set(r,o.d)});
    await bt.commit();return;
  }
  for(var i=0;i<ops.length;i++){if(ops[i].u)await patch(ops[i].c,ops[i].id,ops[i].d);else await put(ops[i].c,ops[i].id,ops[i].d)}
}
function secondaryAuth(){if(!sec)sec=firebase.initializeApp(CFG,'secondary');return sec.auth()}
function stopAll(){unsubs.forEach(function(u){try{u()}catch(e){}});unsubs=[]}

function subscribe(){
  stopAll();
  S.got={u:false,e:false,s:false,l:false,p:false,h:false,m:false,x:false,v:false,t:false,y:false};
  var owner=S.me.role==='owner',cash=S.me.role==='cashier';
  var watch=function(q,fn,flag){
    unsubs.push(q.onSnapshot(function(s){fn(s);S.got[flag]=true;onData()},function(){S.got[flag]=true;toast('ডেটা লোড করা যায়নি',true);onData()}));
  };
  var arr=function(key,flag,q){watch(q,function(s){S[key]=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});if(key==='expenses')S[key]=S[key].filter(function(x){return !x.void})},flag)};
  watch(S.db.doc('settings/main'),function(s){S.settings=s.exists?s.data():null},'s');
  if(owner||cash){
    if(owner){
      watch(S.db.collection('users'),function(s){S.users={};s.docs.forEach(function(d){S.users[d.id]=d.data()})},'u');
      arr('lists','l',S.db.collection('lists').orderBy('ts','desc').limit(300));
    }else{
      watch(S.db.doc('users/'+S.me.id),function(s){S.users={};if(s.exists)S.users[s.id]=s.data()},'u');
      arr('lists','l',S.db.collection('lists').orderBy('ts','desc').limit(300));
    }
    arr('entries','e',S.db.collection('entries').orderBy('date','desc').limit(1000));
    arr('payments','m',S.db.collection('payments').orderBy('ts','desc').limit(1000));
    arr('expenses','x',S.db.collection('expenses').orderBy('date','desc').limit(1000));
    arr('sales','v',S.db.collection('sales').orderBy('date','desc').limit(1000));
    arr('staff','t',S.db.collection('staff').limit(300));
    arr('pay','y',S.db.collection('pay').orderBy('ts','desc').limit(3000));
  }else{
    watch(S.db.doc('users/'+S.me.id),function(s){S.users={};if(s.exists)S.users[s.id]=s.data()},'u');
    S.got.e=true;S.got.m=true;S.got.x=true;S.got.v=true;S.got.t=true;S.got.y=true;
    arr('lists','l',S.db.collection('lists').where('by','==',S.me.id).limit(300));
  }
  arr('products','p',S.db.collection('products').limit(500));
  arr('shops','h',S.db.collection('shops').limit(200));
}

async function onAuth(user){
  if(S.creating)return;
  stopAll();
  S.me=null;S.users={};S.entries=[];S.payments=[];S.expenses=[];S.sales=[];S.staff=[];S.pay=[];S.lists=[];S.products=[];S.shops=[];S.ready=false;
  if(!user){
    try{var st=await S.db.doc('settings/main').get();S.settings=st.exists?st.data():null;S.netErr=false}
    catch(e){S.netErr=true}
    S.ready=true;S.view=null;route();return;
  }
  try{
    var us=await S.db.doc('users/'+user.uid).get();
    var u=us.exists?us.data():null;
    if(!u||u.active===false){
      S.loginError=u?'এই আইডি বন্ধ করা আছে। মালিকের সাথে কথা বলুন।':'এই আইডির অনুমতি নেই।';
      await S.auth.signOut();return;
    }
    var st2=await S.db.doc('settings/main').get();
    S.settings=st2.exists?st2.data():null;
    S.me={id:user.uid,loginId:u.loginId,name:u.name,role:u.role};
    S.netErr=false;
    subscribe();
  }catch(e){S.netErr=true;S.ready=true;route()}
}

function onData(){
  if(S.me&&S.got.u&&S.got.e&&S.got.s&&S.got.l&&S.got.p&&S.got.h&&S.got.m&&S.got.x&&S.got.v&&S.got.t&&S.got.y)S.ready=true;
  if(S.me){
    var u=S.users[S.me.id];
    if(u){S.me.name=u.name;S.me.role=u.role;if(u.active===false){S.loginError='এই আইডি বন্ধ করা আছে।';logout();return}}
  }
  route();
}
function logout(){S.tab=null;S.draft=null;S.sel=null;S.r=null;S.auth.signOut()}

function saveFile(o){
  return new Promise(function(res,rej){
    try{
      var blob=new Blob([o.data],{type:'text/csv;charset=utf-8'});
      var url=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=url;a.download=o.filename;document.body.appendChild(a);a.click();
      setTimeout(function(){URL.revokeObjectURL(url);a.remove()},1000);
      res({status:'saved'});
    }catch(e){rej(e)}
  });
}

function boot(){
  if(!CFG_OK){S.noCfg=true;S.ready=true;route();return}
  if(typeof firebase==='undefined'){S.netErr=true;S.ready=true;route();return}
  try{
    firebase.initializeApp(CFG);
    S.auth=firebase.auth();
    S.db=firebase.firestore();
  }catch(e){S.netErr=true;S.ready=true;route();return}
  S.dl={save:saveFile};
  if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(function(){});
  S.auth.onAuthStateChanged(onAuth);
}

/* ---------- routing ---------- */
function viewKey(){
  if(S.noCfg)return 'nocfg';
  if(S.netErr)return 'neterr';
  if(!S.ready)return 'loading';
  if(!S.me)return !S.settings?'setup':'login';
  return 'app-'+S.me.role;
}
function route(){
  var k=viewKey();
  if(k!==S.view){S.view=k;mount(k)}
  else if(k.indexOf('app')===0)updApp();
}
function rname(){return (S.settings&&S.settings.name)||'বাজার খাতা'}
function isMn(){return !!S.me&&(S.me.role==='owner'||S.me.role==='cashier')}
function roleLabel(){return S.me&&S.me.role==='owner'?'মালিক':S.me&&S.me.role==='cashier'?'ক্যাশিয়ার':'শেফ'}

  '<div class="f"><label for="s_pin">পিন</label><input id="s_pin" type="password" inputmode="numeric" maxlength="6" placeholder="৪ থেকে ৬ সংখ্যা" required></div>'+
  '<p class="err" id="s_err" role="alert" hidden></p><button class="btn" type="submit">খাতা চালু করুন</button></form></section></main>';
  $('#sf').addEventListener('submit',async function(ev){
    ev.preventDefault();
    var er=$('#s_err');er.hidden=true;
    var id=normId($('#s_id').value),pin=$('#s_pin').value.trim(),name=$('#s_name').value.trim();
    var rn=$('#s_rn').value.trim()||'আমার রেস্টুরেন্ট';
    if(!name){er.textContent='আপনার নাম লিখুন';er.hidden=false;return}
    if(!ID_RE.test(id)){er.textContent='আইডি ইংরেজি অক্ষর, সংখ্যা, - বা _ দিয়ে ৩ থেকে ২০টি হতে হবে';er.hidden=false;return}
    if(!PIN_RE.test(pin)){er.textContent='পিন ৪ থেকে ৬টি সংখ্যা হতে হবে';er.hidden=false;return}
    var btn=$('#sf .btn');btn.disabled=true;
    S.creating=true;
    var made=false;
    try{
      var cred=await S.auth.createUserWithEmailAndPassword(toEmail(id),toPass(pin));
      made=true;
      var b=S.db.batch();
      b.set(S.db.doc('users/'+cred.user.uid),{loginId:id,name:name,role:'owner',active:true,created:Date.now()});
      b.set(S.db.doc('settings/main'),{name:rn,created:Date.now()});
      await b.commit();
      S.creating=false;
      await onAuth(S.auth.currentUser);
    }catch(e){
      S.creating=false;
      if(made){try{await S.auth.currentUser.delete()}catch(x){}}
      var c=e&&e.code;
      er.textContent=c==='auth/email-already-in-use'?'এই আইডি আগেই আছে':c==='permission-denied'?'সেটআপ আগেই হয়ে গেছে। ঢুকে পড়ুন।':errMsg(e);
      er.hidden=false;btn.disabled=false;

function visible(){var me=S.me;return S.entries.filter(function(e){return isMn()||e.by===me.id})}
function byNew(a,b){return (b.date>a.date?1:b.date<a.date?-1:0)||((b.ts||0)-(a.ts||0))}
function payChip(e){
  if(e.pay==='due'){if(e.paid)return '<span class="chip paid">বাকি · পরিশোধ</span>';if(+e.paidAmt>0)return '<span class="chip due">বাকি '+money(remain(e))+' · জমা '+money(e.paidAmt)+'</span>';return '<span class="chip due">বাকি</span>';}
  if(e.pay==='mobile')return '<span class="chip mobile">মোবাইল</span>';
  return '<span class="chip">নগদ</span>';
}
function rowHTML(e,who){
  var owner=S.me.role==='owner';
  var sub=[qtyFmt(e.qty)+' '+esc(e.unit),e.shop?esc(e.shop):'',who?esc(e.chefName||e.byName||e.by):'',e.edited?'বদলানো':''].filter(Boolean).join(' · ');
  var payBtn=(owner&&e.pay==='due'&&!e.paid)?'<button class="mini" type="button" data-paid="'+e.id+'">পরিশোধ</button>':'';
  var editBtn=owner?'<button class="mini" type="button" data-edit="'+e.id+'">বদলান</button>':'';
  return '<li class="row" style="flex-wrap:wrap"><div class="r-main"><span class="r-item">'+esc(e.item)+'</span><span class="r-sub">'+sub+'</span><span>'+payChip(e)+'</span></div><div class="r-end"><span class="amt">'+money(e.amount)+'</span><div class="r-act">'+payBtn+editBtn+'</div></div>'+(owner?editFormHTML(e):'')+'</li>';
}
function editFormHTML(e){
  var shops=S.shops.filter(function(s){return !s.off}).map(function(s){return s.name});
  if(e.shop&&shops.indexOf(e.shop)<0)shops.push(e.shop);
  var so='<option value="">দোকান ঠিক নেই</option>'+shops.map(function(n){return '<option value="'+esc(n)+'"'+(n===e.shop?' selected':'')+'>'+esc(n)+'</option>'}).join('');

/* ---------- product and shop pickers ---------- */
var CATS=['সবজি','মাছ','মাংস','মসলা','চাল-ডাল-তেল','দুধ-ডিম','অন্যান্য'];
function r2(n){return Math.round(n*100)/100}
function fillSelect(el,html){
  if(!el)return;
  var v=el.value;el.innerHTML=html;
  if(v&&Array.prototype.some.call(el.options,function(o){return o.value===v}))el.value=v;
}
/* bought / not bought label for a product */
function buyStatus(p){
  var k=String(p.name).trim().toLowerCase(),t=todayISO(),last='',openL=false,owner=isMn();
  if(owner)S.entries.forEach(function(e){if(String(e.item).trim().toLowerCase()===k&&e.date>last)last=e.date});
  S.lists.forEach(function(l){(l.items||[]).forEach(function(i){
    if(String(i.name).trim().toLowerCase()!==k)return;
    if(i.st==='open')openL=true;
    else if(i.st==='done'&&!owner&&l.date>last)last=l.date;
  })});
  var chip=last===t?'<span class="chip paid">আজ কেনা হয়েছে</span>':openL?'<span class="chip due">লিস্টে আছে · কেনা বাকি</span>':'<span class="chip">কেনা হয়নি</span>';
  var sub=last&&last!==t?'শেষ কেনা: '+dayLabel(last):'';
  return {chip:chip,sub:sub};
}
function prodById(id){return S.products.find(function(p){return p.id===id})}
function prodByName(n){var k=String(n||'').trim().toLowerCase();return S.products.find(function(p){return String(p.name).trim().toLowerCase()===k})}
function prodOpts(){
  var by={};
  S.products.forEach(function(p){if(p.off)return;var c=p.cat||'অন্যান্য';(by[c]=by[c]||[]).push(p)});
  var cats=CATS.concat(Object.keys(by).filter(function(c){return CATS.indexOf(c)<0}));
  var h='<option value="">জিনিস বেছে নিন</option>';

    by[c].sort(function(a,b){return String(a.name).localeCompare(String(b.name),'bn')});

  });

  var names=S.shops.filter(function(s){return !s.off}).map(function(s){return s.name}).sort(function(a,b){return String(a).localeCompare(String(b),'bn')});

/* ---------- baki: remaining and partial payments ---------- */
function remain(e){if(e.paid||e.pay!=='due')return 0;return Math.max(0,r2((+e.amount||0)-(+e.paidAmt||0)))}
async function applyPayment(shop,amt,opt){
  opt=opt||{};
  var list=S.entries.filter(function(e){return remain(e)>0&&(e.shop||'')===shop}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.ts||0)-(b.ts||0)});
  var total=sum(list,remain),pay=Math.min(r2(amt),total),left=pay,n=0,date=opt.date||todayISO();
  if(!(pay>0))return {applied:0,left:r2(amt),count:0};
  var pid=Date.now().toString(36)+rnd().slice(0,4);
  var before=total;
  await put('payments',pid,{shop:shop,amount:pay,mode:opt.mode||'cash',note:opt.note||'',date:date,before:r2(before),after:r2(before-pay),by:S.me.id,byName:S.me.name,ts:Date.now()});
  for(var i=0;i<list.length&&left>0;i++){
    var e=list[i],use=Math.min(remain(e),left),pa=r2((+e.paidAmt||0)+use);
    left=r2(left-use);
    await patch('entries',e.id,{paidAmt:pa,paid:r2((+e.amount||0)-pa)<=0,paidOn:date});
    n++;
  }
  return {applied:pay,left:r2(amt-pay),count:n};
}

var PK={salary:'বেতন দিলাম',advance:'অগ্রিম দিলাম',bonus:'বোনাস/ওভারটাইম',deduct:'কাটা (অনুপস্থিত ইত্যাদি)'};
var PKS={salary:'বেতন',advance:'অগ্রিম',bonus:'বোনাস',deduct:'কাটা'};
function mLabel(m){var p=String(m).split('-');return BN_M[(+p[1])-1]+' '+p[0]}
function staffSalary(st,m){
  var h=(st.hist&&st.hist.length?st.hist:[{from:'0000-00',amount:+st.salary||0}]).slice().sort(function(a,b){return a.from<b.from?-1:a.from>b.from?1:0});
  var a=0;h.forEach(function(x){if(x.from<=m)a=+x.amount||0});return a;
}
function staffActive(st,m){
  if(st.joined&&String(st.joined).slice(0,7)>m)return false;
  if(st.off&&st.offMonth&&m>st.offMonth)return false;
  if(st.off&&!st.offMonth)return false;
  return true;
}
function payCalc(st,m){
  var rows=S.pay.filter(function(x){return x.staffId===st.id&&x.month===m&&!x.void});
  var k=function(n){return sum(rows.filter(function(x){return x.kind===n}),function(x){return x.amount})};
  var base=staffSalary(st,m),ded=k('deduct'),adv=k('advance'),paid=k('salary'),bonus=k('bonus');
  return {base:base,ded:ded,adv:adv,paid:paid,bonus:bonus,due:r2(base-ded-adv-paid),rows:rows};
}

function reportData(){
  var r=S.r,t=r.type;
  var list=S.entries.filter(function(e){return (!r.from||e.date>=r.from)&&(!r.to||e.date<=r.to)}).sort(byNew);
  var meta=RTYPES.find(function(x){return x[0]===t});
  if(t==='due')list=list.filter(function(e){return e.pay==='due'&&!e.paid});
  var total=sum(list,function(e){return t==='due'?remain(e):(+e.amount||0)});
  if(t==='all'||t==='due'){
    return {title:meta[1],head:['তারিখ','জিনিস','পরিমাণ','কীভাবে','দোকান','শেফ','টাকা'],
      rows:list.map(function(e){return [e.date,e.item,qtyFmt(e.qty)+' '+e.unit,payLabel(e),e.shop||'',e.chefName||e.byName||e.by,t==='due'?remain(e):(+e.amount||0)]}),
      foot:['মোট',list.length+'টি','','','','',total],num:[6],money:[6],count:list.length,total:total};
  }
  if(t==='price'){
    var pl=list.filter(function(e){return (+e.qty||0)>0&&(!S.r.item||String(e.item).trim().toLowerCase()===S.r.item)}).map(function(e){return {e:e,k:String(e.item).trim().toLowerCase()+'|'+e.unit,up:r2((+e.amount||0)/(+e.qty))}});
    var pmin={};
    pl.forEach(function(x){if(pmin[x.k]===undefined||x.up<pmin[x.k])pmin[x.k]=x.up});
    pl.sort(function(a,b){
      var na=String(a.e.item).trim().toLowerCase(),nb=String(b.e.item).trim().toLowerCase();
      if(na!==nb)return na<nb?-1:1;
      if(a.e.unit!==b.e.unit)return a.e.unit<b.e.unit?-1:1;
      return a.e.date<b.e.date?1:a.e.date>b.e.date?-1:0;
    });
    var prow=pl.map(function(x){
      var mn=pmin[x.k];
      var note=x.up===mn?'সবচেয়ে কম':'+'+Math.round((x.up-mn)/mn*100)+'%';
      return [x.e.date,x.e.item,x.e.shop||'—',qtyFmt(x.e.qty)+' '+x.e.unit,+x.e.amount||0,x.up,note];
    });
    return {title:meta[1],head:['তারিখ','জিনিস','দোকান','পরিমাণ','মোট টাকা','প্রতি একক দাম','তুলনা'],rows:prow,foot:['মোট',pl.length+'বার','','',sum(pl,function(x){return x.e.amount}),'',''],num:[3,4,5],money:[4,5],count:pl.length,total:sum(pl,function(x){return x.e.amount}),ulabel:uniq(pl.map(function(x){return x.e.unit})).join('/')};
  }
  if(t==='monthitem'){
    var mg={};
    list.forEach(function(e){
      var mk=e.date.slice(0,7),ik=String(e.item).trim().toLowerCase(),k=mk+'|'+ik;
      var o=mg[k]||(mg[k]={mk:mk,l:e.item,n:0,a:0,u:{}});
      o.n++;o.a+=+e.amount||0;o.u[e.unit]=(o.u[e.unit]||0)+(+e.qty||0);
    });
    var ma=Object.keys(mg).map(function(k){return mg[k]}).sort(function(a,b){return a.mk<b.mk?1:a.mk>b.mk?-1:b.a-a.a});
    var mrows=ma.map(function(o){
      var mp=o.mk.split('-');
      return [BN_M[mp[1]-1]+' '+mp[0],o.l,Object.keys(o.u).map(function(u){return qtyFmt(o.u[u])+' '+u}).join(' + '),o.n,o.a];
    });
    return {title:meta[1],head:['মাস','জিনিস','মোট পরিমাণ','এন্ট্রি','মোট টাকা'],rows:mrows,foot:['মোট','','',list.length,total],num:[3,4],money:[4],count:list.length,total:total};
  }
  var g={};
  list.forEach(function(e){
    var k,l,sk;
    if(t==='day'){k=e.date;l=dayLabel(e.date);sk=e.date}
    else if(t==='month'){k=e.date.slice(0,7);var p=k.split('-');l=BN_M[p[1]-1]+' '+p[0];sk=k}
    else if(t==='item'){k=String(e.item).trim().toLowerCase();l=e.item;sk=k}
    else if(t==='shop'){k=e.shop||'';l=e.shop||'দোকানের নাম নেই';sk=k}
    else if(t==='chef'){k=e.chef||e.by;l=e.chefName||e.byName||e.by;sk=k}
    else{k=e.pay;l=PAYS[e.pay]||e.pay;sk=k}
    var o=g[k]||(g[k]={l:l,sk:sk,n:0,a:0,u:{}});
    o.n++;o.a+=+e.amount||0;o.u[e.unit]=(o.u[e.unit]||0)+(+e.qty||0);
  });
  var arr=Object.keys(g).map(function(k){return g[k]});
  if(t==='day'||t==='month')arr.sort(function(a,b){return a.sk<b.sk?1:a.sk>b.sk?-1:0});
  else arr.sort(function(a,b){return b.a-a.a});
  var withQty=t==='item';
  var head=[meta[2],'এন্ট্রি'].concat(withQty?['পরিমাণ']:[]).concat(['মোট টাকা','শতাংশ']);
  var rows=arr.map(function(o){
    var pct=total>0?(o.a/total*100).toFixed(1)+'%':'0%';
    var qs=Object.keys(o.u).map(function(u){return qtyFmt(o.u[u])+' '+u}).join(' + ');
    return [o.l,o.n].concat(withQty?[qs]:[]).concat([o.a,pct]);
  });
  var foot=['মোট',list.length].concat(withQty?['']:[]).concat([total,list.length?'100%':'0%']);
  return {title:meta[1]+' রিপোর্ট',head:head,rows:rows,foot:foot,num:withQty?[1,3,4]:[1,2,3],money:[withQty?3:2],count:list.length,total:total};
}

  l.innerHTML=ids.map(function(id){
    var u=S.users[id],own=u.role==='owner',self=id===S.me.id,off=u.active===false;
    return '<div class="urow"><div class="uinfo"><b>'+esc(u.name)+(off?' · বন্ধ':'')+'</b><span class="r-sub">আইডি: '+esc(u.loginId)+' · '+(own?'মালিক':u.role==='cashier'?'ক্যাশিয়ার':'শেফ')+'</span></div><div class="r-act">'+
      (self?'<button class="mini" type="button" data-pintoggle="'+esc(id)+'">পিন বদলান</button>':'')+
      (own?'':'<button class="mini" type="button" data-uoff="'+esc(id)+'">'+(off?'চালু করুন':'বন্ধ করুন')+'</button>')+'</div>'+
      (self?'<form class="pinform" data-pinform="'+esc(id)+'" hidden><input type="password" inputmode="numeric" maxlength="6" placeholder="নতুন পিন" aria-label="নতুন পিন"><button class="mini" type="submit">সেভ</button></form>':'')+'</div>';
  }).join('');
}

/* ---------- tab: setup (owner): shops, products, team ---------- */
function mountSetupTab(v){
  if(!S.sp)S.sp='products';
  v.innerHTML='<div class="seg3" role="group" aria-label="সেটআপ"><button type="button" data-sp="shops">দোকান</button><button type="button" data-sp="products">প্রোডাক্ট</button><button type="button" data-sp="team">টিম</button></div><div id="spBody" class="spbody"></div>';
  if(S.me.role!=='owner'){var tb=v.querySelector('[data-sp="team"]');if(tb)tb.remove();if(S.sp==='team')S.sp='products'}
  $$('.seg3 button').forEach(function(b){b.addEventListener('click',function(){S.sp=this.dataset.sp;showPanel()})});
  showPanel();
}
function showPanel(){
  $$('.seg3 button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.sp===S.sp?'true':'false')});
  var b=$('#spBody');b.innerHTML='';
  if(S.sp==='shops')mountShops(b);else if(S.sp==='team')mountTeam(b);else mountProducts(b);
  updSetup();
}
function updSetup(){
  if(!$('#spBody'))return;
  if(S.sp==='shops')updShops();else if(S.sp==='team')updTeam();else updProducts();
}

function mountShops(b){
  b.innerHTML='<section class="card"><h2>নতুন দোকান</h2><form id="shf" autocomplete="off"><div class="f"><label for="sh_name">দোকান বা আড়তের নাম</label><input id="sh_name" placeholder="যেমন: রহিম আড়ত" required></div><button class="btn" type="submit">দোকান যোগ করুন</button></form></section>'+
  '<section class="card"><div class="sec-h"><h2>সব দোকান</h2><span class="sum" id="shCount"></span></div><div id="shList"></div></section>';
  $('#shf').addEventListener('submit',async function(ev){
    ev.preventDefault();
    var name=$('#sh_name').value.trim();if(!name)return;
    if(S.shops.some(function(s){return String(s.name).trim().toLowerCase()===name.toLowerCase()})){toast('এই নামে দোকান আগেই আছে',true);return}
    try{await put('shops',Date.now().toString(36)+rnd().slice(0,4),{name:name,ts:Date.now()});$('#sh_name').value='';toast('দোকান যোগ হয়েছে')}
    catch(e){toast(errMsg(e),true)}
  });
}
function updShops(){
  var l=$('#shList');if(!l)return;
  var shops=S.shops.slice().sort(function(a,b){return String(a.name).localeCompare(String(b.name),'bn')});
  $('#shCount').textContent=shops.length+'টি';
  l.innerHTML=shops.length?'<ul class="rows">'+shops.map(function(s){
    return '<li class="row"><div class="r-main"><span class="r-item">'+esc(s.name)+(s.off?' · বন্ধ':'')+'</span></div>'+(S.me.role==='owner'?'<div class="r-act"><button class="mini" type="button" data-shoff="'+esc(s.id)+'">'+(s.off?'চালু করুন':'বন্ধ করুন')+'</button></div>':'')+'</li>';
  }).join('')+'</ul>':'<p class="empty">এখনো কোনো দোকান নেই। উপরে প্রথম দোকানের নাম লিখে যোগ করুন।</p>';
}

function mountProducts(b){
  b.innerHTML='<section class="card"><h2>নতুন প্রোডাক্ট</h2><form id="pdf" autocomplete="off">'+
  '<div class="f"><label for="pd_name">নাম</label><input id="pd_name" placeholder="যেমন: পেঁয়াজ" required></div>'+
  '<div class="f"><label for="pd_cat">ধরন</label><select id="pd_cat">'+CATS.map(function(c){return '<option>'+c+'</option>'}).join('')+'</select></div>'+
  '<div class="f"><label for="pd_price">দাম (৳) আর কোন এককে</label><div class="qty"><input id="pd_price" type="number" inputmode="decimal" step="any" min="0" placeholder="যেমন: 60"><select id="pd_unit" aria-label="একক">'+UNITS.map(function(u){return '<option>'+u+'</option>'}).join('')+'</select></div><span class="hint">যেমন: 60 টাকা প্রতি কেজি</span></div>'+
  '<div class="f"><label for="pd_shop">সাধারণত কোন দোকান থেকে</label><select id="pd_shop"></select><span class="hint" id="pdHint" hidden>আগে "দোকান" ট্যাবে দোকান বানালে এখানে বেছে নিতে পারবেন।</span></div>'+
  '<button class="btn" type="submit">প্রোডাক্ট যোগ করুন</button></form></section>'+
  '<section class="card"><div class="sec-h"><h2>সব প্রোডাক্ট</h2><span class="sum" id="pdCount"></span></div><div id="pdList"></div></section>';
  $('#pdf').addEventListener('submit',async function(ev){
    ev.preventDefault();
    var name=$('#pd_name').value.trim();if(!name)return;
    if(prodByName(name)){toast('এই নামে প্রোডাক্ট আগেই আছে',true);return}
    var price=parseFloat($('#pd_price').value);
    try{
      await put('products',Date.now().toString(36)+rnd().slice(0,4),{name:name,cat:$('#pd_cat').value,unit:$('#pd_unit').value,price:price>=0?price:0,shop:$('#pd_shop').value,ts:Date.now()});
      $('#pd_name').value='';$('#pd_price').value='';$('#pd_name').focus();toast('প্রোডাক্ট যোগ হয়েছে');
    }catch(e){toast(errMsg(e),true)}
  });
}
function updProducts(){
  var l=$('#pdList');if(!l)return;
  fillSelect($('#pd_shop'),'<option value="">কোনো দোকান ঠিক নেই</option>'+S.shops.filter(function(s){return !s.off}).map(function(s){return '<option value="'+esc(s.name)+'">'+esc(s.name)+'</option>'}).join(''));
  $('#pdHint').hidden=S.shops.length>0;
  $('#pdCount').textContent=S.products.length+'টি';
  if(!S.products.length){l.innerHTML='<p class="empty">এখনো কোনো প্রোডাক্ট নেই। উপরের ফর্মে প্রথমটা বানান। শেফ আর আপনি এখান থেকে বেছে নেবেন, লিখতে হবে না।</p>';return}
  var by={};S.products.forEach(function(p){var c=p.cat||'অন্যান্য';(by[c]=by[c]||[]).push(p)});
  var cats=CATS.concat(Object.keys(by).filter(function(c){return CATS.indexOf(c)<0}));
  var shopNames=S.shops.filter(function(s){return !s.off}).map(function(s){return s.name});
  var html='';
  cats.forEach(function(c){
    if(!by[c])return;
    by[c].sort(function(a,b){return String(a.name).localeCompare(String(b.name),'bn')});
    html+='<div class="grp"><span>'+esc(c)+'</span><span>'+by[c].length+'টি</span></div><ul class="rows">'+by[c].map(function(p){
      var names=shopNames.slice();if(p.shop&&names.indexOf(p.shop)<0)names.push(p.shop);
      var so='<option value="">কোনো দোকান ঠিক নেই</option>'+names.map(function(n){return '<option value="'+esc(n)+'"'+(n===p.shop?' selected':'')+'>'+esc(n)+'</option>'}).join('');
      var uo=UNITS.map(function(u){return '<option'+(u===p.unit?' selected':'')+'>'+u+'</option>'}).join('');
      var bs=buyStatus(p);
      return '<li class="row" style="flex-wrap:wrap"><div class="r-main"><span class="r-item">'+esc(p.name)+(p.off?' · বন্ধ':'')+'</span><span class="r-sub">'+(+p.price>0?money(p.price)+' / '+esc(p.unit):'দাম লেখা নেই · '+esc(p.unit))+(p.shop?' · '+esc(p.shop):'')+(bs.sub?' · '+bs.sub:'')+'</span><span>'+bs.chip+'</span></div>'+
        (S.me.role==='owner'?'<div class="r-act"><button class="mini" type="button" data-pdtoggle="'+esc(p.id)+'">বদলান</button><button class="mini" type="button" data-poff="'+esc(p.id)+'">'+(p.off?'চালু করুন':'বন্ধ করুন')+'</button></div>':'')+
        (S.me.role==='owner'?'<form class="pform" data-pform="'+esc(p.id)+'" hidden><input class="pf_price" type="number" inputmode="decimal" step="any" min="0" value="'+(+p.price||'')+'" aria-label="দাম"><select class="pf_unit" aria-label="একক">'+uo+'</select><select class="pf_shop" aria-label="দোকান">'+so+'</select><button class="mini" type="submit">সেভ করুন</button></form>':'')+'</li>';
    }).join('')+'</ul>';
  });
  l.innerHTML=html;
}

boot();
})();
</script>
</body></html>
